<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Bank Customer Churn Prediction Dashboard: 10,000+ customers analyzed for churn risk. Segments by age, geography, gender, card ownership and product usage.">
  <title>Bank Customer Churn Prediction Dashboard: 10,000+ customers analyzed for churn risk. Segments by age, geography, gender, card ownership and product usage.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b15"/><stop offset="1" stop-color="#07070d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".75"/><stop offset=".55" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="1" stop-color="#06b6d4" stop-opacity=".6"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset=".6" stop-color="#06b6d4" stop-opacity=".5"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowP" cx=".9" cy="0" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0" cy="1" r=".7"><stop offset="0" stop-color="#06b6d4" stop-opacity=".18"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .tw { animation: tw 4s ease-in-out infinite; } .tw2 { animation-delay: -1.5s; } .tw3 { animation-delay: -2.8s; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .moon { animation: orbit 6s linear infinite; transform-origin: 0 0; } @keyframes orbit { to { transform: rotate(-360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  
  <rect width="440" height="300" rx="18" fill="url(#bg)"/>
  <rect width="440" height="300" rx="18" fill="url(#glowP)"/>
  <rect width="440" height="300" rx="18" fill="url(#glowC)"/>
  <rect x="1" y="1" width="438" height="298" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g><circle class="tw" cx="230.5" cy="57.7" r="1.22" fill="#ffffff"/><circle class="tw tw2" cx="92.5" cy="210.6" r="1.26" fill="#a5f3fc"/><circle class="tw tw3" cx="26.9" cy="254.5" r="1.10" fill="#c4b5fd"/><circle class="tw" cx="216.8" cy="14.3" r="1.11" fill="#ffffff"/><circle class="tw tw2" cx="405.8" cy="215.2" r="0.77" fill="#a5f3fc"/><circle class="tw tw3" cx="337.1" cy="82.0" r="1.35" fill="#c4b5fd"/><circle class="tw" cx="194.0" cy="39.8" r="1.44" fill="#ffffff"/><circle class="tw tw2" cx="160.0" cy="213.5" r="1.39" fill="#a5f3fc"/><circle class="tw tw3" cx="418.2" cy="128.2" r="0.69" fill="#c4b5fd"/><circle class="tw" cx="272.1" cy="208.9" r="0.62" fill="#ffffff"/><circle class="tw tw2" cx="344.9" cy="280.6" r="0.64" fill="#a5f3fc"/><circle class="tw tw3" cx="380.1" cy="168.3" r="1.13" fill="#c4b5fd"/></g>
  <!-- orbit decoration -->
  <g transform="translate(386 58)" opacity=".9">
    <circle r="18" fill="#8b5cf6" fill-opacity=".85"/>
    <circle cx="-5" cy="-5" r="5" fill="#fff" opacity=".3"/>
    <ellipse rx="34" ry="10" fill="none" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="1.5" transform="rotate(-18)"/>
    <g class="moon"><circle cx="34" cy="0" r="3" fill="#ffffff"/></g>
  </g>
  <text x="28" y="42" class="mono" font-size="11" letter-spacing="2.2" fill="#8b5cf6">MISSION 02 · CUSTOMER ANALYTICS</text>
  <text x="28" y="74" font-size="21" font-weight="800" fill="#ffffff">Bank Customer Churn</text>
  <text x="28" y="100" font-size="21" font-weight="800" fill="#ffffff">Prediction Dashboard</text>
  <text x="28" y="148" font-size="34" font-weight="800" fill="url(#accent)">10,000+</text>
  <text x="28" y="170" font-size="13" fill="#a1a1aa">customers analyzed for churn risk</text>
  <text x="28" y="204" font-size="13.5" fill="#d4d4d8">Segments by age, geography, gender,</text>
  <text x="28" y="224" font-size="13.5" fill="#d4d4d8">card ownership and product usage.</text>
  <rect x="28" y="252" width="79.6" height="26" rx="13" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".55"/><text x="67.8" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Power BI</text><rect x="115.6" y="252" width="65.2" height="26" rx="13" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".55"/><text x="148.2" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Python</text><rect x="188.8" y="252" width="137.2" height="26" rx="13" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".55"/><text x="257.4" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Machine Learning</text>
</svg>
