<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Lumina Mart Dairy Intelligence Dashboard: 108M EGP net sales analyzed · 50% YoY growth. 7-page Power BI report uncovering margin erosion: discounts, returns, RFM segments.">
  <title>Lumina Mart Dairy Intelligence Dashboard: 108M EGP net sales analyzed · 50% YoY growth. 7-page Power BI report uncovering margin erosion: discounts, returns, RFM segments.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b15"/><stop offset="1" stop-color="#07070d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".75"/><stop offset=".55" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="1" stop-color="#06b6d4" stop-opacity=".6"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset=".6" stop-color="#06b6d4" stop-opacity=".5"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowP" cx=".9" cy="0" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0" cy="1" r=".7"><stop offset="0" stop-color="#06b6d4" stop-opacity=".18"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .tw { animation: tw 4s ease-in-out infinite; } .tw2 { animation-delay: -1.5s; } .tw3 { animation-delay: -2.8s; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .moon { animation: orbit 6s linear infinite; transform-origin: 0 0; } @keyframes orbit { to { transform: rotate(-360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  
  <rect width="440" height="300" rx="18" fill="url(#bg)"/>
  <rect width="440" height="300" rx="18" fill="url(#glowP)"/>
  <rect width="440" height="300" rx="18" fill="url(#glowC)"/>
  <rect x="1" y="1" width="438" height="298" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g><circle class="tw" cx="161.7" cy="285.2" r="1.16" fill="#ffffff"/><circle class="tw tw2" cx="428.8" cy="78.2" r="1.41" fill="#a5f3fc"/><circle class="tw tw3" cx="315.9" cy="253.8" r="0.83" fill="#c4b5fd"/><circle class="tw" cx="6.5" cy="37.1" r="0.71" fill="#ffffff"/><circle class="tw tw2" cx="123.9" cy="152.9" r="1.41" fill="#a5f3fc"/><circle class="tw tw3" cx="411.3" cy="126.5" r="0.60" fill="#c4b5fd"/><circle class="tw" cx="172.2" cy="82.6" r="1.37" fill="#ffffff"/><circle class="tw tw2" cx="29.8" cy="146.4" r="1.38" fill="#a5f3fc"/><circle class="tw tw3" cx="167.5" cy="142.9" r="1.02" fill="#c4b5fd"/><circle class="tw" cx="328.6" cy="196.9" r="0.66" fill="#ffffff"/><circle class="tw tw2" cx="256.5" cy="133.7" r="0.67" fill="#a5f3fc"/><circle class="tw tw3" cx="134.5" cy="78.0" r="1.43" fill="#c4b5fd"/></g>
  <!-- orbit decoration -->
  <g transform="translate(386 58)" opacity=".9">
    <circle r="18" fill="#f59e0b" fill-opacity=".85"/>
    <circle cx="-5" cy="-5" r="5" fill="#fff" opacity=".3"/>
    <ellipse rx="34" ry="10" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="1.5" transform="rotate(-18)"/>
    <g class="moon"><circle cx="34" cy="0" r="3" fill="#ffffff"/></g>
  </g>
  <text x="28" y="42" class="mono" font-size="11" letter-spacing="2.2" fill="#f59e0b">MISSION 01 · RETAIL BI</text>
  <text x="28" y="74" font-size="21" font-weight="800" fill="#ffffff">Lumina Mart Dairy</text>
  <text x="28" y="100" font-size="21" font-weight="800" fill="#ffffff">Intelligence Dashboard</text>
  <text x="28" y="148" font-size="34" font-weight="800" fill="url(#accent)">108M EGP</text>
  <text x="28" y="170" font-size="13" fill="#a1a1aa">net sales analyzed · 50% YoY growth</text>
  <text x="28" y="204" font-size="13.5" fill="#d4d4d8">7-page Power BI report uncovering margin</text>
  <text x="28" y="224" font-size="13.5" fill="#d4d4d8">erosion: discounts, returns, RFM segments.</text>
  <rect x="28" y="252" width="79.6" height="26" rx="13" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".55"/><text x="67.8" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Power BI</text><rect x="115.6" y="252" width="43.6" height="26" rx="13" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".55"/><text x="137.4" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">RFM</text><rect x="167.2" y="252" width="137.2" height="26" rx="13" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".55"/><text x="235.79999999999998" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Snowflake schema</text>
</svg>
