<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Turning data into insight and satellites into safe travelers. Omar Mohamed Adel.">
  <title>Turning data into insight and satellites into safe travelers. Omar Mohamed Adel.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b15"/><stop offset="1" stop-color="#07070d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".75"/><stop offset=".55" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="1" stop-color="#06b6d4" stop-opacity=".6"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset=".6" stop-color="#06b6d4" stop-opacity=".5"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowP" cx=".9" cy="0" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0" cy="1" r=".7"><stop offset="0" stop-color="#06b6d4" stop-opacity=".18"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .tw { animation: tw 4s ease-in-out infinite; } .tw2 { animation-delay: -1.5s; } .tw3 { animation-delay: -2.8s; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect width="900" height="200" rx="18" fill="url(#bg)"/>
  <g><circle class="tw" cx="214.4" cy="27.3" r="1.41" fill="#ffffff"/><circle class="tw tw2" cx="410.7" cy="78.1" r="1.01" fill="#a5f3fc"/><circle class="tw tw3" cx="729.9" cy="184.1" r="0.69" fill="#c4b5fd"/><circle class="tw" cx="647.0" cy="28.5" r="0.81" fill="#ffffff"/><circle class="tw tw2" cx="537.0" cy="94.6" r="0.86" fill="#a5f3fc"/><circle class="tw tw3" cx="774.9" cy="65.9" r="1.20" fill="#c4b5fd"/><circle class="tw" cx="835.7" cy="25.5" r="1.32" fill="#ffffff"/><circle class="tw tw2" cx="194.5" cy="56.9" r="0.68" fill="#a5f3fc"/><circle class="tw tw3" cx="126.2" cy="43.5" r="1.47" fill="#c4b5fd"/><circle class="tw" cx="105.8" cy="68.4" r="1.36" fill="#ffffff"/><circle class="tw tw2" cx="508.3" cy="15.1" r="0.72" fill="#a5f3fc"/><circle class="tw tw3" cx="808.7" cy="166.9" r="0.83" fill="#c4b5fd"/><circle class="tw" cx="482.1" cy="7.1" r="1.16" fill="#ffffff"/><circle class="tw tw2" cx="803.3" cy="19.1" r="1.18" fill="#a5f3fc"/><circle class="tw tw3" cx="347.5" cy="86.2" r="1.29" fill="#c4b5fd"/><circle class="tw" cx="389.6" cy="91.6" r="0.94" fill="#ffffff"/><circle class="tw tw2" cx="404.6" cy="118.9" r="1.41" fill="#a5f3fc"/><circle class="tw tw3" cx="767.5" cy="51.3" r="1.28" fill="#c4b5fd"/><circle class="tw" cx="53.4" cy="172.0" r="0.92" fill="#ffffff"/><circle class="tw tw2" cx="437.1" cy="164.6" r="0.71" fill="#a5f3fc"/><circle class="tw tw3" cx="493.8" cy="112.2" r="1.02" fill="#c4b5fd"/><circle class="tw" cx="598.4" cy="98.2" r="1.34" fill="#ffffff"/><circle class="tw tw2" cx="225.9" cy="6.1" r="1.12" fill="#a5f3fc"/><circle class="tw tw3" cx="651.4" cy="119.0" r="0.75" fill="#c4b5fd"/><circle class="tw" cx="449.7" cy="120.3" r="0.61" fill="#ffffff"/><circle class="tw tw2" cx="896.0" cy="93.4" r="1.06" fill="#a5f3fc"/><circle class="tw tw3" cx="565.1" cy="121.6" r="0.69" fill="#c4b5fd"/><circle class="tw" cx="732.2" cy="88.2" r="0.76" fill="#ffffff"/><circle class="tw tw2" cx="872.2" cy="76.5" r="0.76" fill="#a5f3fc"/><circle class="tw tw3" cx="460.2" cy="170.0" r="1.05" fill="#c4b5fd"/></g>
  <ellipse cx="450" cy="560" rx="760" ry="420" fill="#05050b"/>
  <ellipse cx="450" cy="560" rx="760" ry="420" fill="none" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)" opacity=".85"/>
  <text x="450" y="70" text-anchor="middle" font-size="22" font-style="italic" font-weight="600" fill="#ffffff">“Turning data into insight and satellites into safe travelers.”</text>
  <text x="450" y="100" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#a78bfa">— OMAR MOHAMED ADEL</text>
  <text x="450" y="170" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#67e8f9" fill-opacity=".8">END OF TRANSMISSION · THANKS FOR VISITING</text>
  <rect x="1" y="1" width="898" height="198" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
