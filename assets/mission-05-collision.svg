<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Satellite Collision Risk Dashboard: 20+ satellites assessed for collision risk. Orbital data and machine-learning predictions with interactive Plotly visuals.">
  <title>Satellite Collision Risk Dashboard: 20+ satellites assessed for collision risk. Orbital data and machine-learning predictions with interactive Plotly visuals.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b15"/><stop offset="1" stop-color="#07070d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".75"/><stop offset=".55" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="1" stop-color="#06b6d4" stop-opacity=".6"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset=".6" stop-color="#06b6d4" stop-opacity=".5"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowP" cx=".9" cy="0" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0" cy="1" r=".7"><stop offset="0" stop-color="#06b6d4" stop-opacity=".18"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .tw { animation: tw 4s ease-in-out infinite; } .tw2 { animation-delay: -1.5s; } .tw3 { animation-delay: -2.8s; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .moon { animation: orbit 6s linear infinite; transform-origin: 0 0; } @keyframes orbit { to { transform: rotate(-360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  
  <rect width="440" height="300" rx="18" fill="url(#bg)"/>
  <rect width="440" height="300" rx="18" fill="url(#glowP)"/>
  <rect width="440" height="300" rx="18" fill="url(#glowC)"/>
  <rect x="1" y="1" width="438" height="298" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g><circle class="tw" cx="436.7" cy="274.9" r="1.41" fill="#ffffff"/><circle class="tw tw2" cx="403.7" cy="7.7" r="0.81" fill="#a5f3fc"/><circle class="tw tw3" cx="39.6" cy="256.4" r="0.99" fill="#c4b5fd"/><circle class="tw" cx="407.8" cy="246.2" r="1.42" fill="#ffffff"/><circle class="tw tw2" cx="371.7" cy="101.9" r="0.67" fill="#a5f3fc"/><circle class="tw tw3" cx="114.6" cy="248.5" r="0.92" fill="#c4b5fd"/><circle class="tw" cx="259.7" cy="211.2" r="0.74" fill="#ffffff"/><circle class="tw tw2" cx="110.6" cy="114.8" r="1.41" fill="#a5f3fc"/><circle class="tw tw3" cx="290.4" cy="84.4" r="1.50" fill="#c4b5fd"/><circle class="tw" cx="102.5" cy="244.9" r="1.39" fill="#ffffff"/><circle class="tw tw2" cx="170.3" cy="121.5" r="1.45" fill="#a5f3fc"/><circle class="tw tw3" cx="237.0" cy="139.0" r="1.16" fill="#c4b5fd"/></g>
  <!-- orbit decoration -->
  <g transform="translate(386 58)" opacity=".9">
    <circle r="18" fill="#06b6d4" fill-opacity=".85"/>
    <circle cx="-5" cy="-5" r="5" fill="#fff" opacity=".3"/>
    <ellipse rx="34" ry="10" fill="none" stroke="#06b6d4" stroke-opacity=".7" stroke-width="1.5" transform="rotate(-18)"/>
    <g class="moon"><circle cx="34" cy="0" r="3" fill="#ffffff"/></g>
  </g>
  <text x="28" y="42" class="mono" font-size="11" letter-spacing="2.2" fill="#06b6d4">MISSION 05 · SPACE SAFETY · ML</text>
  <text x="28" y="74" font-size="21" font-weight="800" fill="#ffffff">Satellite Collision</text>
  <text x="28" y="100" font-size="21" font-weight="800" fill="#ffffff">Risk Dashboard</text>
  <text x="28" y="148" font-size="34" font-weight="800" fill="url(#accent)">20+</text>
  <text x="28" y="170" font-size="13" fill="#a1a1aa">satellites assessed for collision risk</text>
  <text x="28" y="204" font-size="13.5" fill="#d4d4d8">Orbital data and machine-learning</text>
  <text x="28" y="224" font-size="13.5" fill="#d4d4d8">predictions with interactive Plotly visuals.</text>
  <rect x="28" y="252" width="65.2" height="26" rx="13" fill="#06b6d4" fill-opacity=".14" stroke="#06b6d4" stroke-opacity=".55"/><text x="60.6" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Python</text><rect x="101.2" y="252" width="108.4" height="26" rx="13" fill="#06b6d4" fill-opacity=".14" stroke="#06b6d4" stroke-opacity=".55"/><text x="155.4" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">scikit-learn</text><rect x="217.60000000000002" y="252" width="65.2" height="26" rx="13" fill="#06b6d4" fill-opacity=".14" stroke="#06b6d4" stroke-opacity=".55"/><text x="250.20000000000002" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Plotly</text>
</svg>
